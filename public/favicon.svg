<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Cosmic Glass Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c123d"/>
      <stop offset="50%" stop-color="#0e0822"/>
      <stop offset="100%" stop-color="#060312"/>
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d2bbff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Prism Wing Gradient (Lavender / Violet) -->
    <linearGradient id="leftWing" x1="16" y1="46" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Right Prism Wing Gradient (Cyan / Sapphire) -->
    <linearGradient id="rightWing" x1="48" y1="46" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Center Keystone Beam -->
    <linearGradient id="centerBeam" x1="32" y1="12" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e9d5ff"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Center Ambient Halo -->
  <circle cx="32" cy="32" r="22" fill="url(#ambientGlow)"/>

  <!-- Prism Facets (Aether 'A' & Evaluation Keystone) -->
  <g filter="url(#bloom)">
    <!-- Left Wing -->
    <path d="M32 14L16 45C15.5 46 16.2 47.2 17.4 47.2H24.5L32 32L32 14Z" fill="url(#leftWing)"/>

    <!-- Right Wing -->
    <path d="M32 14L48 45C48.5 46 47.8 47.2 46.6 47.2H39.5L32 32L32 14Z" fill="url(#rightWing)"/>

    <!-- Consensus Crossbar / Evaluation Ledger Bridge -->
    <path d="M22 36H42L39 42H25L22 36Z" fill="url(#centerBeam)" opacity="0.95"/>

    <!-- Diamond Core Spark -->
    <polygon points="32,24 35,32 32,40 29,32" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="32" r="2" fill="#7bd0ff"/>

    <!-- Apex Luminary Star -->
    <circle cx="32" cy="14" r="2.5" fill="#ffffff"/>
  </g>
</svg>